<div class="event-card-wrap" [class.squarish]="variant === 'squarish'" [class.square]="variant === 'square'">

    <a [routerLink]="['/event', id]" class="event-card" [class.squarish]="variant === 'squarish'" [class.square]="variant === 'square'">

        <div class="poster">

            <img
                [src]="image"
                [alt]="title"
                loading="lazy"
                [style.object-position]="imagePosition">

            <span class="category-badge">{{ category }}</span>

            @if (canSave) {
                <button
                    type="button"
                    class="save-icon-btn"
                    [class.saved]="isSaved"
                    [disabled]="saveLoading"
                    (click)="toggleSave($event)"
                    [attr.aria-label]="isSaved ? 'Remove from saved' : 'Save event'">
                    <i class="bi" [class.bi-bookmark-fill]="isSaved" [class.bi-bookmark]="!isSaved"></i>
                </button>
            }

            <div class="poster-glow"></div>

        </div>

        <div class="info">

            <h3 class="title">{{ title }}</h3>

            <p class="meta">
                <i class="bi bi-calendar-event"></i>
                <span>{{ date }}</span>
            </p>

            <p class="meta">
                <i class="bi bi-geo-alt"></i>
                <span>{{ location }}</span>
            </p>

        </div>

    </a>

</div>
