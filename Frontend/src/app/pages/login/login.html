<app-navbar></app-navbar>

<div class="page-shell">
    <app-page-backdrop></app-page-backdrop>

<div class="login-page page-body">

<div class="login-box">

<h2 class="text-center text-white mb-4">Welcome Back</h2>

@if (error) {
    <div class="alert alert-danger py-2">{{ error }}</div>
}

@if (info) {
    <div class="alert alert-success py-2">{{ info }}</div>
}

<form (ngSubmit)="onSubmit()">

<input
    type="email"
    class="form-control mb-3"
    placeholder="Enter your email"
    [(ngModel)]="email"
    name="email"
    required>

<input
    type="password"
    class="form-control mb-2"
    placeholder="Enter your password"
    [(ngModel)]="password"
    name="password"
    required>

<div class="forgot-row">
    <a routerLink="/forgot-password" class="forgot-link">Forgot password?</a>
</div>

<button
    type="submit"
    class="btn btn-success w-100"
    [disabled]="loading">
    {{ loading ? 'Logging in...' : 'Login' }}
</button>

</form>

@if (showResendVerification) {
    <div class="verify-banner">
        <p>Need to verify your email?</p>
        <button type="button" class="btn btn-outline-light w-100" (click)="resendVerification()" [disabled]="resendLoading">
            {{ resendLoading ? 'Sending...' : 'Resend Verification Email' }}
        </button>
    </div>
}

<p class="text-center text-secondary mt-3">
Don't have an account?
<a routerLink="/register" class="register-link">Create one here</a>
</p>

</div>

</div>

    <app-footer></app-footer>
</div>
