<app-navbar></app-navbar>

<div class="page-shell">
    <app-page-backdrop></app-page-backdrop>

    <div class="auth-page page-body">
        <div class="auth-box">
            <h2>Forgot Password</h2>
            <p class="sub">Enter your email and we'll send you a link to reset your password.</p>

            @if (error) {
                <div class="alert alert-danger py-2">{{ error }}</div>
            }

            @if (success) {
                <div class="alert alert-success py-2">{{ success }}</div>
                @if (devResetLink) {
                    <p class="dev-link">
                        Dev reset link:
                        <a [href]="devResetLink">{{ devResetLink }}</a>
                    </p>
                }
            } @else {
                <form (ngSubmit)="onSubmit()">
                    <input
                        type="email"
                        class="form-control mb-4"
                        placeholder="Enter your email"
                        [(ngModel)]="email"
                        name="email"
                        required>

                    <button type="submit" class="btn btn-success w-100" [disabled]="loading">
                        {{ loading ? 'Sending...' : 'Send Reset Link' }}
                    </button>
                </form>
            }

            <p class="footer-link">
                Remember your password?
                <a routerLink="/login" class="register-link">Back to Login</a>
            </p>
        </div>
    </div>

    <app-footer></app-footer>
</div>
