<app-navbar></app-navbar>

<div class="page-shell">
    <app-page-backdrop></app-page-backdrop>

    <div class="auth-page page-body">
        <div class="auth-box">
            <h2>Set New Password</h2>
            <p class="sub">Choose a strong password for your account.</p>

            @if (error) {
                <div class="alert alert-danger py-2">{{ error }}</div>
            }

            @if (success) {
                <div class="alert alert-success py-2">{{ success }}</div>
                <a routerLink="/login" class="btn btn-success w-100 mt-2">Go to Login</a>
            } @else {
                <form (ngSubmit)="onSubmit()">
                    <input
                        type="password"
                        class="form-control mb-3"
                        placeholder="New password (min 8 characters)"
                        [(ngModel)]="newPassword"
                        name="newPassword"
                        required>

                    <input
                        type="password"
                        class="form-control mb-4"
                        placeholder="Confirm new password"
                        [(ngModel)]="confirmPassword"
                        name="confirmPassword"
                        required>

                    <button type="submit" class="btn btn-success w-100" [disabled]="loading">
                        {{ loading ? 'Saving...' : 'Reset Password' }}
                    </button>
                </form>
            }

            <p class="footer-link">
                <a routerLink="/login" class="register-link">Back to Login</a>
            </p>
        </div>
    </div>

    <app-footer></app-footer>
</div>
